name: Deploy AttentionPay Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-attentionpay
  AZURE_CONTAINER_APP: attentionpay-backend
  AZURE_CONTAINER_REGISTRY: acrattentionpay
  IMAGE_NAME: attentionpay-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify backend Python files
      - name: Verify Python files
        run: |
          python -m compileall backend

      # 3. Log in to Azure using GitHub OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name $AZURE_CONTAINER_REGISTRY

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            .

      # 6. Push Docker image to ACR
      - name: Push Docker image
        run: |
          docker push \
            $AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # 7. Configure Container App to use ACR managed identity
      - name: Configure ACR managed identity
        run: |
          az containerapp registry set \
            --name $AZURE_CONTAINER_APP \
            --resource-group $AZURE_RESOURCE_GROUP \
            --server $AZURE_CONTAINER_REGISTRY.azurecr.io \
            --identity system

      # 8. Deploy the new image
      - name: Deploy backend
        run: |
          az containerapp update \
            --name $AZURE_CONTAINER_APP \
            --resource-group $AZURE_RESOURCE_GROUP \
            --image $AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            --cpu 1.0 \
            --memory 2.0Gi

      # 9. Configure external ingress on port 8000
      - name: Configure backend ingress
        run: |
          az containerapp ingress enable \
            --name $AZURE_CONTAINER_APP \
            --resource-group $AZURE_RESOURCE_GROUP \
            --type external \
            --target-port 8000 \
            --transport auto